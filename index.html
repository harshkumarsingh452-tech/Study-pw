    #chatScreen { display: none; flex-direction: column; height: 100%; background-color: #0b141a; color: #e9edef; }

    .chat-user { font-size: 15px; font-weight: 600; }

    .deleted-msg { font-style: italic; color: rgba(241, 241, 241, 0.5) !important; }

    .sender-name { font-size: 12px; font-weight: 700; color: #25d366; margin-bottom: 3px; display: block; }
    
    .msg-meta { font-size: 10px; color: rgba(241, 241, 241, 0.6); float: right; margin-left: 8px; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
    .tick { font-size: 12px; color: #8696a0; font-weight: bold; }
    .tick.read { color: #53bdeb; }

    /* INPUT BAR & CONTROLS */
    .input-bar { padding: 8px; background: #202c33; display: flex; gap: 6px; align-items: center; }
    .input-bar input[type="text"] { flex: 1; background: #2a3942; border: none; padding: 10px 14px; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }
    .icon-btn { background: #00a884; border: none; color: white; min-width: 36px; height: 36px; border-radius: 50%; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    .chat-img { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 4px; object-fit: cover; }
    .chat-gif { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 4px; object-fit: contain; background: #000; }

    /* MODALS */
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal-box { background: #202c33; width: 100%; max-width: 320px; padding: 20px; border-radius: 10px; text-align: center; color: white; position: relative; }
    .modal-box input { width: 100%; padding: 8px; margin: 12px 0; background: #2a3942; border: 1px solid #374248; border-radius: 6px; color: white; outline: none; }
    .modal-box button { width: 100%; padding: 10px; background: #00a884; border: none; border-radius: 6px; color: white; font-weight: 600; margin-top: 6px; cursor: pointer; }
    .btn-danger { background: #dc2626 !important; }

    .gif-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow-y: auto; flex: 1; margin-top: 8px; padding-right: 4px; }
    .gif-item { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.1s; }

    function checkCode(input) {
      if (input.value.trim() === UNLOCK_CODE) {

    function unlockChat() {

    function lockApp() {
      document.getElementById('chatScreen').style.display = 'none';

      closeCameraModal();
    }

    function initChat() {
      document.getElementById("displayNick").innerText = myName;
      listenMessages();
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      
      messagesRef.push({
        sender: myName,
        type: "text",
        message: text,
        time: time,
        status: "sent",
        deletedForEveryone: false
      });

      input.value = '';
    }

    /* VOICE RECORDING LOGIC */
    async function toggleRecord() {
      const recordBtn = document.getElementById('recordBtn');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => sendVoiceNote(reader.result);
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.classList.add('recording-active');
          recordBtn.innerText = '⏹️';
        } catch (err) {
          alert('Microphone permission required!');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording-active');
        recordBtn.innerText = '🎙️';
      }
    }

    function sendVoiceNote(audioData) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      messagesRef.push({
        sender: myName,
        type: "audio",
        audioUrl: audioData,
        time: time,
        status: "sent",
        deletedForEveryone: false
      });
    }

    /* IMAGE HANDLING LOGIC */
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressAndSendImage(file);
    }

    function compressAndSendImage(fileOrBlob) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
          
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
          messagesRef.push({
            sender: myName,
            type: "image",
            imageUrl: compressedBase64,
            time: time,
            status: "sent",
            deletedForEveryone: false
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(fileOrBlob);
    }

        const res = await fetch(`https://g.tenor.com/v1/trending?key=LIVDSRZULELA&limit=20`);

        renderGifGrid(data.results);
      } catch (e) {
        container.innerHTML = '<div style="grid-column: span 2; text-align:center; padding:20px; font-size:13px; color:#dc2626;">Failed to load GIFs</div>';
      }
    }

    async function searchGifs() {
      const query = document.getElementById('gifSearchInput').value.trim();
      const container = document.getElementById('gifGridContainer');
      if (!query) {
        loadTrendingGifs();
        return;
      }
      container.innerHTML = '<div style="grid-column: span 2; text-align:center; padding:20px; font-size:13px; color:#8696a0;">Searching...</div>';
      try {
        const res = await fetch(`https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=LIVDSRZULELA&limit=20`);
        const data = await res.json();
        renderGifGrid(data.results);
      } catch (e) {
        container.innerHTML = '<div style="grid-column: span 2; text-align:center; padding:20px; font-size:13px; color:#dc2626;">Search failed</div>';
      }
    }

    function renderGifGrid(results) {
      const container = document.getElementById('gifGridContainer');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<div style="grid-column: span 2; text-align:center; padding:20px; font-size:13px; color:#8696a0;">No GIFs found</div>';
        return;
      }
      results.forEach(item => {
        const gifUrl = item.media[0].tinygif.url;
        const img = document.createElement('img');
        img.src = gifUrl;
        img.className = 'gif-item';
        img.onclick = () => sendSelectedGif(gifUrl);
        container.appendChild(img);
      });
    }

    function sendSelectedGif(url) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      messagesRef.push({
        sender: myName,
        type: "gif",
        gifUrl: url,
        time: time,
        status: "sent",
        deletedForEveryone: false
      });
      closeGifModal();
    }

    /* CAMERA HANDLING LOGIC */
    async function openCameraModal() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        document.getElementById('cameraView').srcObject = cameraStream;
        document.getElementById('cameraModal').style.display = 'flex';
      } catch (e) {
        alert("Unable to access camera permission!");
      }
    }

    function closeCameraModal() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      document.getElementById('cameraModal').style.display = 'none';
    }

    function captureCameraPhoto() {
      const video = document.getElementById('cameraView');
      const canvas = document.getElementById('cameraCanvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      canvas.toBlob((blob) => {
        compressAndSendImage(blob);
        closeCameraModal();
      }, 'image/jpeg');
    }

    function openFullImage(url) {
      document.getElementById('previewImgElement').src = url;
      document.getElementById('imgPreviewModal').style.display = 'flex';
    }
